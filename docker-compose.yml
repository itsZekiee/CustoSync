version: "3.8"

services:
  # ─── Reverse Proxy / Load Balancer ───────────────────────────────────
  controller:
    build:
      context: ./docker/controller
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - custosync

  # ─── Laravel API (PHP-FPM) ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    volumes:
      - ./api:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:GENERATE_ME
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: custosync
      DB_USERNAME: custosync
      DB_PASSWORD: secret
      ELASTICSEARCH_HOST: http://searcher:9200
    depends_on:
      database:
        condition: service_healthy
      searcher:
        condition: service_healthy
    networks:
      - custosync

  # ─── MySQL Database ─────────────────────────────────────────────────
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: custosync
      MYSQL_USER: custosync
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - custosync

  # ─── Elasticsearch Search Index ──────────────────────────────────────
  searcher:
    image: elasticsearch:8.12.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - custosync

networks:
  custosync:
    driver: bridge

volumes:
  db_data:
  es_data:
